name: Deploy Django API to EC2 via Docker Hub

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code update
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/portfolio-api:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/portfolio-api:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/portfolio-api:latest

            docker stop portfolio-api || true
            docker rm portfolio-api || true

            docker run -d \
              -p 80:8000 \
              --name portfolio-api \
              --restart unless-stopped \
              --env-file /home/ubuntu/.env \
              ${{ secrets.DOCKER_USERNAME }}/portfolio-api:latest